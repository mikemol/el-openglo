[project]
name = "el-openglo"
version = "0.1.0"
description = "An electroluminescent-display desktop theme, generated from one palette"
# >=3.13: mikemol-mdstruct (tooling extra) requires it; the venv runs 3.14
requires-python = ">=3.13"
# PEP 639 SPDX expression (W44); emitters.LICENSE_SPDX is the generators' copy,
# and scripts/check_license.py refuses if the two disagree with Apache-2.0.
license = "Apache-2.0"
license-files = ["LICENSE"]

# ⚑ A DEPENDENCY NAMED ONLY IN A DOCSTRING IS A PERMISSION SLIP.  Every import in
# the tree is declared here or recorded below as deliberately absent.  The list
# was DISCOVERED by walking the AST of every module, not remembered — see
# scripts/check_deps.py, which re-runs that walk and refuses if the two disagree.
#
# The base set is what the CORE emission path needs: solve the palette, emit the
# schemes, render the previews and wallpapers.
dependencies = [
    "cairosvg",         # SVG -> PNG for previews, wallpapers, and the package build
    "colorspacious",    # CVD (colour-vision-deficiency) gating of the palette
    "numpy",            # the palette solver and the glyph matcher
    "pillow",           # raster compositing for the boot splash and font ingest
    "fonttools",        # make_font: the segment/matrix TTFs are emitted natively (W24);
                        # also the research pipeline's TTF ingest
]

[project.optional-dependencies]
# The research pipeline: font ingest and the cohomological glyph matcher.
research = [
    "material-color-utilities",   # scripts/check_monet.py — Android's own scheme derivation (W18)
    "matplotlib",       # the phosphor showcase renderer
    "scipy",            # the matcher's strata / congruence machinery
]

# ⚑ THE BORROWED TOOLS' DEPENDENCIES, WHICH NOTHING HERE IMPORTS.
#
# `.claude/skills/struct-tools/SKILL.md` routes .py to substrate's pycodemod and
# .md to its mdstruct — and BOTH sat in that table unable to run, because their
# dependencies are not this repo's. check_deps.py walks THIS tree's imports, so
# it reported "8 of 8 accounted for" while the named owner of two artifact kinds
# raised ModuleNotFoundError. Every gate stayed green; the structural hook
# refused grep and pointed at a tool that could not start.
#
# That is the routing table naming a capability the machine does not have. The
# dependency belongs here even though no local `import` will ever justify it.
tooling = [
    # ⚑ mdstruct IS A PUBLISHED DISTRIBUTION NOW, NOT A SCRATCH FILE (operator,
    # 2026-09-22: "substrate's scratch mdstruct is obsolete and retired; ~/github/mtools
    # has mdstruct, a github remote, and installs into a .venv properly via PEP
    # reference"). A PEP 508 git reference: real files, content-addressed, no
    # symlink deriving the wrong root. `uv sync --extra tooling` puts `mdstruct` on
    # the venv's PATH; the struct-tools table routes .md to it.
    # ⚑ ONE mtools SHA ACROSS EVERY SPEC (mtools INSTALL.md: two `@main` specs resolve to
    # ONE commit, and it may be the wrong one; only a sha pin moves it). mdstruct was
    # unpinned `#subdirectory=` until mikemol-hooks joined it (2026-09-25, ⟐H2).
    "mikemol-mdstruct @ git+https://github.com/mikemol/mtools.git@4c8e73cc39fb6c3e5cfcbfca966f0cd330f6267a#subdirectory=mdstruct",
    # the shared git pre-push (mtools ec71fe7+): .githooks/pre-push execs its console
    # script, which runs THIS repo's .githooks/pre-push.local — replacing the symlink
    # into ../substrate (operator, via substrate: "don't use symlinks, import as packages")
    "mikemol-hooks @ git+https://github.com/mikemol/mtools.git@4c8e73cc39fb6c3e5cfcbfca966f0cd330f6267a#subdirectory=hooks",
    # ⚑ THE QUEUE'S ONE WRITER (paths-forward-loop §0; operator 2026-09-26, via nemik:
    # adoption was "missing"). .claude/paths-forward.json and .ledger are read and written
    # ONLY by .venv/bin/mikemol-paths-forward; scripts/paths_forward.py is retired (W88).
    "mikemol-pathsforward @ git+https://github.com/mikemol/mtools.git@4c8e73cc39fb6c3e5cfcbfca966f0cd330f6267a#subdirectory=pathsforward",
    # ⚑ paperkit AS A PACKAGE (operator, 2026-09-25: "Don't use substrate's bibstruct.
    # Use paperkit's." — and "paperkit exposes itself as a package"). The warrants
    # .bib is read with the SAME parser that gates it (worklist_gate.warrants ->
    # `from paperkit import bib`), not a borrowed substrate script whose own
    # dependencies became ours. Sha-pinned, never @main (mtools INSTALL.md). The gate
    # itself still runs the LOCATED checkout (worklist_gate.locate); this is the reader.
    # ⚑ pycodemod FROM mtools, NOT substrate's scratch copy (operator, 2026-09-29: "Don't use
    # substrate, use mtools; substrate is getting drained into mtools, with mtools holding
    # cleaner versions"). mikemol-pycodemod is the cleanroom port (libcst REQUIRED, so a missing
    # parser fails at install rather than every mode returning a false zero). W144.
    "mikemol-pycodemod @ git+https://github.com/mikemol/mtools.git@4c8e73cc39fb6c3e5cfcbfca966f0cd330f6267a#subdirectory=pycodemod",
    # ⚑ THE LOCATED paperkit CHECKOUT IMPORTS IT (paperkit/project.py: `from
    # mikemol.atomicwrite.durable import write_atomic`), so `worklist_gate.py --project` died
    # with ModuleNotFoundError the first time the checkout moved past this venv (W487,
    # 2026-10-11). The gate only verifies and never imported it; the projector writes.
    "mikemol-atomicwrite @ git+https://github.com/mikemol/mtools.git@4c8e73cc39fb6c3e5cfcbfca966f0cd330f6267a#subdirectory=atomicwrite",
    # ⚑ THE SAME CLASS, ONE DIST FURTHER (W530, 2026-10-12): the located paperkit's bib.py now does
    # `import mikemol.grade.grade` (the grade ladder, moved out of paperkit by mtools:W557), so the worklist
    # and readme stages died with ModuleNotFoundError when the checkout moved past this venv.
    "mikemol-grade @ git+https://github.com/mikemol/mtools.git@4c8e73cc39fb6c3e5cfcbfca966f0cd330f6267a#subdirectory=grade",
    # ⚑ THE SAME CLASS AGAIN (W536, 2026-10-12): the located paperkit's bib.py now does
    # `import mikemol.bibparse.bibparse` (the .bib parser, moved out of paperkit into mtools), so the
    # worklist and readme stages died with ModuleNotFoundError and the commit gate refused.
    "mikemol-bibparse @ git+https://github.com/mikemol/mtools.git@4c8e73cc39fb6c3e5cfcbfca966f0cd330f6267a#subdirectory=bibparse",
    # W139/W210: Rego specs as pytest items (mtools:W372 7b1e381 adds expect.deny, so a
    # refusing case is expressible and the falsifiability pair survives the port)
    "mikemol-pytestspec @ git+https://github.com/mikemol/mtools.git@4c8e73cc39fb6c3e5cfcbfca966f0cd330f6267a#subdirectory=pytestspec",
    # ⚑ THE COMMIT LOCK (github-8f 2026-10-12, mtools:W1016 and W1022): mikemol-commit looks for
    # mikemol-membudget beside the interpreter, and mikemol-fence ships it. No //fence venv per repo
    # (ruled fleet-wide): the dist is pinned here at the same par sha as every other mikemol spec.
    "mikemol-fence @ git+https://github.com/mikemol/mtools.git@4c8e73cc39fb6c3e5cfcbfca966f0cd330f6267a#subdirectory=fence",
    # ⚑ THE RATCHET (W256): the mtools tool that refuses NEW debt against a recorded baseline (SKELETON.md: `ratchet
    # --init-absent` mints the baseline). Same par sha as every other spec: one sha across the fleet (INSTALL.md).
    "mikemol-ratchet @ git+https://github.com/mikemol/mtools.git@4c8e73cc39fb6c3e5cfcbfca966f0cd330f6267a#subdirectory=ratchet",
    # ⚑ THE SAME CLASS A FOURTH TIME (W559, 2026-10-16; W487, W530, W536 were the first three): the located
    # paperkit's cache.py now does `import mikemol.mutation.mutate` (the perturbation leaf, mtools:W556), so
    # `worklist_gate.py --discriminate` died with ModuleNotFoundError before it graded one claim. Stdlib-only.
    "mikemol-mutation @ git+https://github.com/mikemol/mtools.git@4c8e73cc39fb6c3e5cfcbfca966f0cd330f6267a#subdirectory=mutation",
    # ⚑ THE CVD CORE IS AN mtools DIST NOW (W544, for nemik:W438; mtools:W1313 to W1315): worst_view_dE,
    # VIEWS, OKABE_ITO, reference_floor, reference_floors and rgb, ported from this repo's cvd_core.py
    # (9a4be98) with parity checked on five pairs and the Okabe-Ito floor. WCAG and APCA stay in cvd_gate.
    # Pinned at the commit that landed it; the next fleet repin moves it with every other spec.
    "mikemol-cvdcore @ git+https://github.com/mikemol/mtools.git@4c8e73cc39fb6c3e5cfcbfca966f0cd330f6267a#subdirectory=cvdcore",
    # ⚑ THE LANDING CHAIN AS A RECIPE (W714, from W555; mtools:W1355 landed Phase.act): waldo's phases carry
    # an act and a done witness read off the world, so the land_template chain can be expressed as one recipe.
    # Standard library only; the same par sha as every other spec.
    "mikemol-waldo @ git+https://github.com/mikemol/mtools.git@4c8e73cc39fb6c3e5cfcbfca966f0cd330f6267a#subdirectory=waldo",
    # W85 (2026-10-02): past paperkit 0249924 (W50 there: the Δ scratch honours TMPDIR)
    "paperkit @ git+https://github.com/mikemol/paperkit.git@b5877102af3b48005fde814416bff5b8f06ba5cd",
    "panflute",         # mdstruct's parser (pandoc itself is on PATH)
    "libcst",           # substrate/scratch/pycodemod.py — lossless Python CST
    "networkx",         # substrate/scratch/dagcone.py — reachability over the claim DAG
    "python-magic>=0.4.27",
    "tinycss2",         # scripts/check_css.py — a real CSS tokenizer for the emitted stylesheet
                        # (present transitively via cairosvg, but a check's dependency is declared)
]
# QML linting for the packaged widgets: qml_sanity.py (rebuilt W25, 2026-09-21)
# wraps the SYSTEM qmllint and qml runner (dev-qt/qtdeclarative on Gentoo; the
# ebuild declares it) — no Python Qt binding is needed, so no extra is declared.

# ⚑ ABSENT, AND RECORDED RATHER THAN QUIETLY TOLERATED:
#
#   gcalc  — the g-calculus solver, LOCATED at ~/github/gcalculus and not vendored,
#   exactly as paperkit is (scripts/worklist_gate.py owns where THAT lives).  It is
#   not a PyPI distribution and must not become one here: it is a sibling working
#   tree, so declaring it as a dependency would name a package that does not exist
#   and make `uv sync` fail.  scripts/check_palette_graph.py imports it for
#   cycle_basis and SKIPS — counted and printed — when it is not importable, since
#   a missing optional dependency is a fact about the machine, not the artifact.
#   NOT CONFIRMED IS NOT FAILED.
#
#   KvFlat  — NOT a Python dependency: make_kvantum.py recolours the upstream
#   Kvantum theme "KvFlat" (by Tsu Jan, GPL-family licensing preserved per
#   COTYPE.md), reading /tmp/KvFlat.kvconfig + /tmp/KvFlat.svg.  Those were staged
#   in /tmp and did not survive the reset.  The generator is intact; its INPUT is
#   absent, so it is the one emitter that cannot run here until KvFlat is fetched
#   and staged.  This is a missing external input, not replay damage — recorded
#   rather than repaired, because inventing a substitute theme would produce
#   plausible output that is not the thing.
#
#   qml_sanity  — WAS recorded here as lost (a module of this project, not a
#   PyPI package, imported by make_deb inside a function). Rebuilt 2026-09-21
#   (W25) on the system qmllint; kept as the record that the archive's own
#   notes never listed it as missing.

[tool.mypy]
# ⚑ THE LAYOUT IS DECLARED, NOT SUPPRESSED (W255). The scripts reach one another by short
# module name through sys.path.insert (`import opa_gate`, `import variant_roster`), which no
# type checker can see; mypy_path states the same search path. mikemol-hook-pycheck runs mypy
# on every edited .py with this file as its config, imports followed (mtools
# hooks/src/mikemol/hooks/checkers.py): relief lives on the ENUMERABLE side, so there is no
# [[tool.mypy.overrides]] and no ignore_missing_imports here. Third-party packages that ship
# no stubs are declared as stub files under stubs/ (also on this path), never ignored.
mypy_path = ["scripts", "catalog/library", "templates", "stubs"]
python_version = "3.13"
explicit_package_bases = true

[tool.pytest.ini_options]
# ⚑ REGO SPECS AS PYTEST ITEMS (W211; mikemol-pytestspec). A spec that imports the shared helper package
# (`import data.el.truth`) compiles only if the helper is loaded too, and nothing is loaded implicitly: the
# helper paths are DECLARED here (mtools:W380). `pytest policy/qml_lint.rego` runs policy/qml_lint.cases.json.
# opa test policy/ stays the full record; these cases carry the deny and withheld id sets, not `admitted`.
pytestspec_data = "policy/lib"

[tool.uv]
# Environment is uv-managed: `uv sync` for the base, `uv sync --extra research`
# to add the pipeline.  Never `pip install` into an ambient interpreter.
package = false
