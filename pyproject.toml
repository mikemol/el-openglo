[project]
name = "el-openglo"
version = "0.1.0"
description = "An electroluminescent-display desktop theme, generated from one palette"
# >=3.13: mikemol-mdstruct (tooling extra) requires it; the venv runs 3.14
requires-python = ">=3.13"

# ⚑ A DEPENDENCY NAMED ONLY IN A DOCSTRING IS A PERMISSION SLIP.  Every import in
# the tree is declared here or recorded below as deliberately absent.  The list
# was DISCOVERED by walking the AST of every module, not remembered — see
# scripts/check_deps.py, which re-runs that walk and refuses if the two disagree.
#
# The base set is what the CORE emission path needs: solve the palette, emit the
# schemes, render the previews and wallpapers.
dependencies = [
    "cairosvg",         # SVG -> PNG for previews, wallpapers, and the package build
    "colorspacious",    # CVD (colour-vision-deficiency) gating of the palette
    "numpy",            # the palette solver and the glyph matcher
    "pillow",           # raster compositing for the boot splash and font ingest
    "fonttools",        # make_font: the segment/matrix TTFs are emitted natively (W24);
                        # also the research pipeline's TTF ingest
]

[project.optional-dependencies]
# The research pipeline: font ingest and the cohomological glyph matcher.
research = [
    "material-color-utilities",   # scripts/check_monet.py — Android's own scheme derivation (W18)
    "matplotlib",       # the phosphor showcase renderer
    "scipy",            # the matcher's strata / congruence machinery
]

# ⚑ THE BORROWED TOOLS' DEPENDENCIES, WHICH NOTHING HERE IMPORTS.
#
# `.claude/skills/struct-tools/SKILL.md` routes .py to substrate's pycodemod and
# .md to its mdstruct — and BOTH sat in that table unable to run, because their
# dependencies are not this repo's. check_deps.py walks THIS tree's imports, so
# it reported "8 of 8 accounted for" while the named owner of two artifact kinds
# raised ModuleNotFoundError. Every gate stayed green; the structural hook
# refused grep and pointed at a tool that could not start.
#
# That is the routing table naming a capability the machine does not have. The
# dependency belongs here even though no local `import` will ever justify it.
tooling = [
    # ⚑ mdstruct IS A PUBLISHED DISTRIBUTION NOW, NOT A SCRATCH FILE (operator,
    # 2026-09-22: "substrate's scratch mdstruct is obsolete and retired; ~/github/mtools
    # has mdstruct, a github remote, and installs into a .venv properly via PEP
    # reference"). A PEP 508 git reference: real files, content-addressed, no
    # symlink deriving the wrong root. `uv sync --extra tooling` puts `mdstruct` on
    # the venv's PATH; the struct-tools table routes .md to it.
    "mikemol-mdstruct @ git+https://github.com/mikemol/mtools#subdirectory=mdstruct",
    "panflute",         # mdstruct's parser (pandoc itself is on PATH)
    "libcst",           # substrate/scratch/pycodemod.py — lossless Python CST
    "networkx",         # substrate/scratch/dagcone.py — reachability over the claim DAG
    "python-magic>=0.4.27",
    "tinycss2",         # scripts/check_css.py — a real CSS tokenizer for the emitted stylesheet
                        # (present transitively via cairosvg, but a check's dependency is declared)
]
# QML linting for the packaged widgets: qml_sanity.py (rebuilt W25, 2026-09-21)
# wraps the SYSTEM qmllint and qml runner (dev-qt/qtdeclarative on Gentoo; the
# ebuild declares it) — no Python Qt binding is needed, so no extra is declared.

# ⚑ ABSENT, AND RECORDED RATHER THAN QUIETLY TOLERATED:
#
#   gcalc  — the g-calculus solver, LOCATED at ~/github/gcalculus and not vendored,
#   exactly as paperkit is (scripts/worklist_gate.py owns where THAT lives).  It is
#   not a PyPI distribution and must not become one here: it is a sibling working
#   tree, so declaring it as a dependency would name a package that does not exist
#   and make `uv sync` fail.  scripts/check_palette_graph.py imports it for
#   cycle_basis and SKIPS — counted and printed — when it is not importable, since
#   a missing optional dependency is a fact about the machine, not the artifact.
#   NOT CONFIRMED IS NOT FAILED.
#
#   KvFlat  — NOT a Python dependency: make_kvantum.py recolours the upstream
#   Kvantum theme "KvFlat" (by Tsu Jan, GPL-family licensing preserved per
#   COTYPE.md), reading /tmp/KvFlat.kvconfig + /tmp/KvFlat.svg.  Those were staged
#   in /tmp and did not survive the reset.  The generator is intact; its INPUT is
#   absent, so it is the one emitter that cannot run here until KvFlat is fetched
#   and staged.  This is a missing external input, not replay damage — recorded
#   rather than repaired, because inventing a substitute theme would produce
#   plausible output that is not the thing.
#
#   qml_sanity  — WAS recorded here as lost (a module of this project, not a
#   PyPI package, imported by make_deb inside a function). Rebuilt 2026-09-21
#   (W25) on the system qmllint; kept as the record that the archive's own
#   notes never listed it as missing.

[tool.uv]
# Environment is uv-managed: `uv sync` for the base, `uv sync --extra research`
# to add the pipeline.  Never `pip install` into an ambient interpreter.
package = false
