# The overlay is a SUBDIRECTORY of the theme's own repo, wired by local path — the
# pattern this host already runs for luthen (/etc/portage/repos.conf/luthen.conf).
# Making the repo root the overlay root would work for Portage and break every
# overlay linter on 79 Python files; a subdirectory keeps both roles clean.
#
# The ebuild's src_install IS `make_deb.py --stage "${D}"`: one staging function,
# two packagers (the Kubuntu .deb and this), so the install set cannot drift.
masters = gentoo
thin-manifests = true
sign-manifests = false
