<svg xmlns="http://www.w3.org/2000/svg" width="384" height="256" viewBox="0 0 384 256">
  <rect width="384" height="256" fill="#0c161f"/>
  <!-- window -->
  <rect x="42" y="40" width="230" height="150" rx="6" fill="#0b131b"
        stroke="#99ccff" stroke-width="1.5"/>
  <rect x="42" y="40" width="230" height="22" rx="6" fill="#4ba2fa"/>
  <circle cx="56" cy="51" r="4" fill="#99ccff"/>
  <circle cx="70" cy="51" r="4" fill="#99ccff"/>
  <!-- phosphor text lines -->
  <rect x="58" y="80"  width="140" height="7" rx="2" fill="#99ccff"/>
  <rect x="58" y="98"  width="180" height="7" rx="2" fill="#99ccff" opacity="0.75"/>
  <rect x="58" y="116" width="110" height="7" rx="2" fill="#99ccff" opacity="0.55"/>
  <rect x="58" y="150" width="70"  height="20" rx="3" fill="#99ccff"/>
  <!-- segment clock motif -->
  <g transform="translate(288,150)" font-family="monospace" font-weight="bold">
    <rect x="-4" y="-26" width="76" height="44" rx="4" fill="#0c161f"
          stroke="#99ccff" stroke-width="1"/>
    <text x="34" y="7" font-size="30" fill="#99ccff" text-anchor="middle"
          letter-spacing="2">12:00</text>
  </g>
  <!-- panel -->
  <rect x="0" y="230" width="384" height="26" fill="#0b131b"/>
  <rect x="8" y="237" width="40" height="12" rx="3" fill="#99ccff"/>
  <rect x="314" y="237" width="60" height="12" rx="3" fill="#99ccff" opacity="0.7"/>
</svg>