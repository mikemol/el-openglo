<svg xmlns="http://www.w3.org/2000/svg" width="384" height="256" viewBox="0 0 384 256">
  <rect width="384" height="256" fill="#0c1f1a"/>
  <!-- window -->
  <rect x="42" y="40" width="230" height="150" rx="6" fill="#0b1b17"
        stroke="#4bfad7" stroke-width="1.5"/>
  <rect x="42" y="40" width="230" height="22" rx="6" fill="#23f9ce"/>
  <circle cx="56" cy="51" r="4" fill="#99ffeb"/>
  <circle cx="70" cy="51" r="4" fill="#4bfad7"/>
  <!-- phosphor text lines -->
  <rect x="58" y="80"  width="140" height="7" rx="2" fill="#99ffeb"/>
  <rect x="58" y="98"  width="180" height="7" rx="2" fill="#99ffeb" opacity="0.75"/>
  <rect x="58" y="116" width="110" height="7" rx="2" fill="#99ffeb" opacity="0.55"/>
  <rect x="58" y="150" width="70"  height="20" rx="3" fill="#4bfad7"/>
  <!-- segment clock motif -->
  <g transform="translate(322,150)" font-family="monospace" font-weight="bold">
    <rect x="-59.0" y="-26" width="118.0" height="44" rx="4" fill="#0c1f1a"
          stroke="#4bfad7" stroke-width="1"/>
    <text x="0" y="7" font-size="30" fill="#4bfad7" text-anchor="middle"
          letter-spacing="2">12:00</text>
  </g>
  <!-- panel -->
  <rect x="0" y="230" width="384" height="26" fill="#0b1b17"/>
  <rect x="8" y="237" width="40" height="12" rx="3" fill="#4bfad7"/>
  <rect x="314" y="237" width="60" height="12" rx="3" fill="#99ffeb" opacity="0.7"/>
</svg>